name: Build Runtime zip

on:
  push:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast stub shadps4 build (true = pipeline test, false = real)"
        type: boolean
        default: false

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      FAST_FDROID_BUILD: ${{ inputs.fast == true && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install git and dependencies
        run: |
          apt-get update
          apt-get install -y git curl nodejs python3

      - name: Ensure shadps4 project files and submodules are ready
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export GIT_CONFIG_NOSYSTEM=1
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          echo "Setting up project files..."
          python3 - <<'PY'
          import os
          import shutil

          src = os.path.join(os.environ["GITHUB_WORKSPACE"], "runtime", "sources", "shadps4")
          dest = os.environ["GITHUB_WORKSPACE"]
          if os.path.isdir(src):
              for item in os.listdir(src):
                  if item in {".git", "runtime"}:
                      continue
                  source = os.path.join(src, item)
                  target = os.path.join(dest, item)
                  if os.path.isdir(source) and not os.path.islink(source):
                      shutil.copytree(source, target, symlinks=True, dirs_exist_ok=True)
                  else:
                      shutil.copy2(source, target, follow_symlinks=False)
          PY

          echo "Initializing build repository..."
          rm -rf "$GITHUB_WORKSPACE/.git"
          git init -q "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name ci
          git -C "$GITHUB_WORKSPACE" config user.email ci@example.com
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -qm "bootstrap repo layout"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"

          if [ -f "$GITHUB_WORKSPACE/.gitmodules" ]; then
            echo "Manually cloning submodules..."
            while IFS= read -r sub_path; do
              sub_url=$(awk -v p="$sub_path" '$0 ~ "path = " p {getline; sub("^[[:space:]]*url = ", "", $0); print; exit}' .gitmodules)
              test -n "$sub_url"
              echo "Cloning $sub_path from $sub_url..."
              rm -rf "$sub_path"
              mkdir -p "$(dirname "$sub_path")"
              git clone --depth 1 "$sub_url" "$sub_path"
              if [ -f "$sub_path/.gitmodules" ]; then
                git -C "$sub_path" submodule update --init --recursive --depth 1
              fi
            done < <(sed -n 's/^[[:space:]]*path = //p' .gitmodules)
          fi

      - name: Fetch box64 at the pinned revision
        run: |
          rm -rf runtime/sources/box64
          bash runtime/scripts/checkout-component.sh box64 https://github.com/ptitSeb/box64.git 50c8b90b09b433ab0767de44af2d0731cb0748b7

      - name: Install Debian build dependencies
        run: bash runtime/scripts/install-debian-runtime-deps.sh

      - name: Fetch locked runtime inputs (Arch glibc/mesa/X11 packages)
        run: node runtime/scripts/fetch-runtime-inputs.mjs

      - name: Build runtime (shadps4 + box64 + guest libs) and package zip
        run: bash runtime/scripts/build-runtime-debian.sh

      - name: Upload runtime.zip
        uses: actions/upload-artifact@v4
        with:
          name: Upload runtime.zip + manifest json
          path: |
            app/src/main/assets/runtime/runtime.zip
            app/src/main/assets/runtime/manifest.json
            runtime.zip
          if-no-files-found: error
