name: Build Runtime zip

on:
  push:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast stub shadps4 build (true = pipeline test, false = real)"
        type: boolean
        default: false

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      FAST_FDROID_BUILD: ${{ inputs.fast == true && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install git and dependencies
        run: |
          apt-get update
          apt-get install -y git curl nodejs python3

      - name: Ensure shadps4 project files and submodules are ready
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export GIT_CONFIG_NOSYSTEM=1
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          echo "Setting up project files..."
          python3 - <<'PY'
          import os
          import shutil

          src = os.path.join(os.environ["GITHUB_WORKSPACE"], "runtime", "sources", "shadps4")
          dest = os.environ["GITHUB_WORKSPACE"]
          if os.path.isdir(src):
              for item in os.listdir(src):
                  if item in {".git", "runtime"}:
                      continue
                  source = os.path.join(src, item)
                  target = os.path.join(dest, item)
                  if os.path.isdir(source) and not os.path.islink(source):
                      shutil.copytree(source, target, symlinks=True, dirs_exist_ok=True)
                  else:
                      shutil.copy2(source, target, follow_symlinks=False)
          PY

          echo "Initializing build repository..."
          rm -rf "$GITHUB_WORKSPACE/.git"
          git init -q "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config user.name ci
          git -C "$GITHUB_WORKSPACE" config user.email ci@example.com
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -qm "bootstrap repo layout"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"

          git_retry() {
            local attempt=1
            local max_attempts=5
            while true; do
              if GIT_TERMINAL_PROMPT=0 git -c http.version=HTTP/1.1 -c protocol.version=2 "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "Git network operation failed (attempt $attempt/$max_attempts); retrying..." >&2
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          clone_retry() {
            local destination=$1
            shift
            local attempt=1
            local max_attempts=5
            while true; do
              rm -rf "$destination"
              if git_retry clone --no-tags "$@" "$destination"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "Clone failed (attempt $attempt/$max_attempts); retrying from a clean directory..." >&2
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          fetch_mesa_archive() {
            local parent=$1
            local mesa_path="$parent/externals/mesa"
            local mesa_revision
            local mesa_url
            local archive
            mesa_revision=$(git -C "$parent" ls-tree HEAD -- externals/mesa | awk '{print $3}')
            mesa_url=$(git -C "$parent" config -f .gitmodules --get submodule.externals/mesa.url)
            if [ -z "$mesa_revision" ] || [ -z "$mesa_url" ]; then
              echo "Unable to derive the pinned nested Mesa revision or URL" >&2
              return 1
            fi
            archive=$(mktemp)
            echo "Falling back to the exact Mesa commit archive $mesa_revision..."
            curl --fail --location --silent --show-error --retry 6 --retry-all-errors \
              --retry-delay 10 "${mesa_url%.git}/-/archive/$mesa_revision/mesa-$mesa_revision.tar.gz" \
              --output "$archive"
            rm -rf "$mesa_path"
            mkdir -p "$mesa_path"
            tar -xzf "$archive" --strip-components=1 -C "$mesa_path"
            rm -f "$archive"
            test -f "$mesa_path/meson.build"
          }

          fetch_nested_submodules() {
            local parent=$1
            if git_retry -C "$parent" submodule update --init --recursive --depth 1 --jobs 1; then
              return 0
            fi
            if [ -f "$parent/.gitmodules" ] && grep -q 'path = externals/mesa' "$parent/.gitmodules"; then
              git -C "$parent" submodule deinit -f --all || true
              fetch_mesa_archive "$parent"
              return 0
            fi
            return 1
          }

          if [ -f "$GITHUB_WORKSPACE/.gitmodules" ]; then
            echo "Cloning submodules from their declared URLs and branches..."
            python3 - <<'PY' > /tmp/shadps4-submodules.tsv
          import configparser
          from pathlib import Path

          config = configparser.ConfigParser()
          config.read('.gitmodules')
          for section in config.sections():
              if not section.startswith('submodule '):
                  continue
              path = config[section].get('path', '').strip()
              url = config[section].get('url', '').strip()
              branch = config[section].get('branch', '').strip()
              if path and url:
                  print(f'{path}\t{url}\t{branch}')
          PY
            while IFS=$'\t' read -r sub_path sub_url sub_branch; do
              test -n "$sub_path"
              echo "Cloning $sub_path from $sub_url${sub_branch:+ (branch $sub_branch)}..."
              rm -rf "$sub_path"
              mkdir -p "$(dirname "$sub_path")"
              clone_args=(--depth 1)
              if [ -n "$sub_branch" ]; then
                clone_args+=(--branch "$sub_branch")
              fi
              clone_retry "$sub_path" "${clone_args[@]}" "$sub_url"
              if [ -f "$sub_path/.gitmodules" ]; then
                fetch_nested_submodules "$sub_path"
              fi
            done < /tmp/shadps4-submodules.tsv
          fi

      - name: Fetch box64 at the pinned revision
        run: |
          rm -rf runtime/sources/box64
          bash runtime/scripts/checkout-component.sh box64 https://github.com/ptitSeb/box64.git 50c8b90b09b433ab0767de44af2d0731cb0748b7

      - name: Install Debian build dependencies
        run: bash runtime/scripts/install-debian-runtime-deps.sh

      - name: Fetch locked runtime inputs (Arch glibc/mesa/X11 packages)
        run: node runtime/scripts/fetch-runtime-inputs.mjs

      - name: Build runtime (shadps4 + box64 + guest libs) and package zip
        run: bash runtime/scripts/build-runtime-debian.sh

      - name: Upload runtime.zip
        uses: actions/upload-artifact@v4
        with:
          name: Upload runtime.zip + manifest json
          path: |
            app/src/main/assets/runtime/runtime.zip
            app/src/main/assets/runtime/manifest.json
            runtime.zip
          if-no-files-found: error
