name: Build Runtime zip

on:
  push:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast stub shadps4 build (true = pipeline test, false = real)"
        type: boolean
        default: false

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      FAST_FDROID_BUILD: ${{ inputs.fast == true && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install git and dependencies
        run: |
          apt-get update
          apt-get install -y git curl nodejs python3

      - name: Ensure shadps4 project files and submodules are ready
        shell: bash
        run: |
          set -euo pipefail
          
          echo "Setting up project files..."
          # Copy everything from shadps4 source to root, EXCEPT the runtime folder (which we just deleted anyway)
          if [ -d runtime/sources/shadps4 ]; then
            cp -rp runtime/sources/shadps4/* .
            [ -f runtime/sources/shadps4/.gitmodules ] && cp runtime/sources/shadps4/.gitmodules .
          fi
          
          # Ensure no leftover .git directories are confusing things
          find . -name ".git" -type d -not -path "./.git" -exec rm -rf {} + || true
          
          echo "Initializing fresh git repo for build..."
          rm -rf .git
          git init -q
          git config user.name ci
          git config user.email ci@example.com
          git add -A
          git commit -qm "bootstrap repo layout"
          
          if [ -f .gitmodules ]; then
            echo "Manually cloning submodules..."
            grep "path =" .gitmodules | sed 's/.*path = //' | while read -r sub_path; do
                sub_url=$(grep -A 2 "path = $sub_path" .gitmodules | grep "url =" | sed 's/.*url = //')
                echo "Cloning $sub_path from $sub_url..."
                rm -rf "$sub_path"
                mkdir -p "$(dirname "$sub_path")"
                git clone --depth 1 "$sub_url" "$sub_path" || true
            done
          fi

      - name: Fetch box64 at the pinned revision
        run: |
          rm -rf runtime/sources/box64
          bash runtime/scripts/checkout-component.sh box64 https://github.com/ptitSeb/box64.git 50c8b90b09b433ab0767de44af2d0731cb0748b7

      - name: Install Debian build dependencies
        run: bash runtime/scripts/install-debian-runtime-deps.sh

      - name: Fetch locked runtime inputs (Arch glibc/mesa/X11 packages)
        run: node runtime/scripts/fetch-runtime-inputs.mjs

      - name: Build runtime (shadps4 + box64 + guest libs) and package zip
        run: bash runtime/scripts/build-runtime-debian.sh

      - name: Upload runtime.zip
        uses: actions/upload-artifact@v4
        with:
          name: Upload runtime.zip + manifest json
          path: |
            app/src/main/assets/runtime/runtime.zip
            app/src/main/assets/runtime/manifest.json
            runtime.zip
          if-no-files-found: error
